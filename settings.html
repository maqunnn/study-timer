<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fff"><title>設定 — 4</title><link rel="stylesheet" href="./style.css"><link rel="icon" href="./icons/icon.svg"><script type="module" src="./settings.js"></script></head><body><main class="settings"><a href="./">戻る</a><h1>接続設定</h1><p>学習ログはまずこの端末に保存します。接続できるときにSheetsへ送信します。</p><form id="config"><label for="endpoint">Apps Script 公開URL</label><input id="endpoint" type="url" required placeholder="https://script.google.com/macros/s/…/exec" autocomplete="url"><label for="token">接続トークン</label><input id="token" type="password" required autocomplete="off" spellcheck="false"><button type="submit" class="primary">接続を確認して保存</button></form><p id="status" class="status" role="status" aria-live="polite"></p><hr><h2>FOCUSについて</h2><p>FOCUS ONは手動の目印です。iPhoneは画面ロック・別アプリ・Safariへの移動を正確な学習状態として記録できません。このスイッチはスマホを閉じて学ぶ時間を自分で記録します。</p><button id="retry" class="quiet">未送信ログを再送</button><button id="export" class="quiet">端末のログをバックアップ</button><p>バックアップに接続トークンは含めません。端末・ブラウザ間でログやタイマーは同期しません。</p></main></body></html>
