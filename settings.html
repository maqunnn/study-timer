<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fff"><title>設定 — Belajar</title><link rel="stylesheet" href="./style.css"><link rel="icon" href="./icons/icon.svg"><script type="module" src="./settings.js"></script></head><body><main class="settings"><a href="./">Belajarに戻る</a><h1>接続設定</h1><p>学習記録は先にこの端末へ保存し、通信できるとGoogle Sheetsへ送ります。</p><form id="config"><label for="endpoint">Apps Scriptの公開URL</label><input id="endpoint" type="url" required placeholder="https://script.google.com/macros/s/…/exec" autocomplete="url"><label for="token">接続トークン</label><input id="token" type="password" required autocomplete="off" spellcheck="false"><button type="submit" class="primary">接続して設定を保存</button></form><p id="status" class="status" role="status" aria-live="polite"></p><hr><h2>FOCUSについて</h2><p>FOCUS ONの時間は、集中していた時間として別に記録します。スマホのロックや別アプリの使用を自動で判定する機能ではありません。スマホを閉じて勉強する時間を記録したいときに、ご自身でONにしてください。</p><button id="retry" class="quiet">未送信の記録を再送</button><button id="export" class="quiet">記録をバックアップ</button><p>バックアップに接続トークンは含まれません。記録とタイマーは端末・ブラウザー間で同期されません。</p></main></body></html>
