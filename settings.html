<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fff"><title>設定 — 4</title><link rel="stylesheet" href="./style.css"><link rel="icon" href="./icons/icon.svg"><script type="module" src="./settings.js"></script></head><body><main class="settings"><a href="./">戻る</a><h1>接続設定</h1><p>記録はまずこの端末に保存し、通信できるとGoogle Sheetsへ送信します。</p><form id="config"><label for="endpoint">Apps Scriptの公開URL</label><input id="endpoint" type="url" required placeholder="https://script.google.com/macros/s/…/exec" autocomplete="url"><label for="token">接続トークン</label><input id="token" type="password" required autocomplete="off" spellcheck="false"><button type="submit" class="primary">接続して設定を保存</button></form><p id="status" class="status" role="status" aria-live="polite"></p><hr><h2>FOCUSについて</h2><p>FOCUS ONの間は、集中していた時間として別に記録します。画面ロックや別アプリへの切り替えを自動で判定する機能ではありません。勉強中にスマホを閉じるなど、ご自身の基準で切り替えてください。</p><button id="retry" class="quiet">未送信の記録を再送</button><button id="export" class="quiet">記録をバックアップ</button><p>バックアップに接続トークンは含めません。端末・ブラウザ間でログやタイマーは同期しません。</p></main></body></html>
