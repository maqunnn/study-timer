<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ffffff"><title>接続設定 — タイマー</title><link rel="stylesheet" href="./style.css"><link rel="icon" href="./icons/icon.svg"><script type="module" src="./settings.js"></script></head><body><main class="settings"><a href="./">戻る</a><h1>接続設定</h1><p>記録はまずこの端末に保存されます。Google Sheetsとつなぐと、通信できるときに自動で送信します。</p><form id="config"><label for="endpoint">Apps Script 公開URL</label><input id="endpoint" type="url" required placeholder="https://script.google.com/macros/s/…/exec" autocomplete="off"><label for="token">接続トークン</label><input id="token" type="password" required autocomplete="off" spellcheck="false"><button class="primary" type="submit">設定を保存して接続を確認</button></form><p id="status" class="status" role="status"></p><hr><button id="retry" class="quiet">未送信の記録を再送</button><button id="export" class="quiet">端末の記録をバックアップ</button><p>バックアップはJSON形式です。接続トークンは含みません。端末やブラウザを変えると、タイマーとTODAYの表示は共有されません。</p></main></body></html>
