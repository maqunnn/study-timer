<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#ffffff"><meta name="description" content="4技能を、ひとつずつ。インドネシア語の学習時間記録。"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><title>タイマー — 学習時間記録</title><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icons/icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="./icons/apple-touch-icon.png"><link rel="stylesheet" href="./style.css"><script type="module" src="./app.js"></script></head>
<body><main class="timer-app"><section id="home"><h1><a href="./settings.html" id="date" aria-label="今日の日付・接続設定"></a></h1><div class="today"><span id="today">00:00</span><span class="caption">TODAY</span></div><div class="skills" aria-label="学習を開始"><button data-skill="Listening">聞く</button><button data-skill="Speaking">話す</button><button data-skill="Reading">読む</button><button data-skill="Writing">書く</button></div></section><section id="session" hidden><h2 id="skill"></h2><div id="clock" role="timer" aria-label="学習時間">00:00:00</div><p id="paused" class="caption">&nbsp;</p><div class="actions"><button id="finish" class="primary">終了</button><button id="toggle" class="quiet">一時停止</button></div></section><p id="status" class="status" role="status" aria-live="polite"></p><noscript>JavaScriptを有効にすると使用できます。</noscript></main></body></html>
