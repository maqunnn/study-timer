<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ffffff"><meta name="description" content="インドネシア語の学習時間記録アプリ Belajar"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><title>Belajar — 学習時間</title><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icons/icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="./icons/apple-touch-icon.png"><link rel="stylesheet" href="./style.css"><script type="module" src="./app.js"></script></head><body><main class="app"><section id="home"><div class="homeTop"><h1><span id="brand">Belajar</span></h1><a class="settingsLink" href="./settings.html">設定</a></div><div class="today"><span id="today">00:00</span><span class="caption">今日の合計</span></div><div class="methods" aria-label="学習方法を選択"><button data-method="material">教材</button><button data-method="vocabulary">単語</button><button data-method="ai">AI</button><button data-method="other">その他</button></div></section><section id="timer" hidden><h2 id="method"></h2><p id="clock" role="timer" aria-label="学習経過時間">00:00:00</p><p id="timerState" class="timerState" data-state="active" aria-live="off">計測中</p><button id="focus" class="focus" aria-pressed="false" aria-label="FOCUS、集中した時間の自己記録">FOCUS OFF</button><button id="end" class="primary">終了</button><button id="pause" class="quiet">一時停止</button></section><section id="skillPicker" hidden><h2>今回使った技能</h2><p class="sessionSummary" id="sessionSummary"></p><p class="hint">当てはまるものを選択（複数可）</p><div class="skillOptions"><button data-skill="speaking" aria-pressed="false">話す</button><button data-skill="writing" aria-pressed="false">書く</button><button data-skill="reading" aria-pressed="false">読む</button><button data-skill="listening" aria-pressed="false">聞く</button></div><button id="save" class="primary">保存する</button><p class="hint noneHint">技能を選ばずに保存できます</p></section><p id="status" class="status" role="status" aria-live="polite"></p></main></body></html>
